# ⚠️ SOURCE DE VÉRITÉ : dépôt EPSILON. Ce fichier est publié automatiquement vers
# ioup3409/EPSILON-install à chaque tag de version (.github/workflows/docker-publish.yml),
# et c'est cette copie publiée que l'installeur télécharge.
# NE PAS l'éditer dans EPSILON-install : la prochaine release écraserait la modification.
# Le corollaire est ce qui compte : un changement de core qui exige un changement ici se
# fait DANS LE MÊME COMMIT que le code — sinon on livre un core qui attend une plomberie
# absente (cas vécu : l'agent hôte et son volume de socket).
services:
  epsilon:
    image: ghcr.io/ioup3409/epsilon:${EPSILON_VERSION:-latest}
    ports:
      - "${EPSILON_PORT:-3000}:3000"
      # Port HTTPS (optionnel). Sert uniquement si vous activez HTTPS depuis
      # l'admin (Réseau ▸ Certificats). Tant que HTTPS n'est pas activé, rien
      # n'écoute derrière — la publication est inoffensive. Le port publié DOIT
      # être identique à HTTPS_PORT ci-dessous pour que la redirection HTTP→HTTPS
      # pointe sur le bon port. Si 443 est déjà pris sur l'hôte, définissez
      # EPSILON_HTTPS_PORT (ex: 8443) dans .env.
      - "${EPSILON_HTTPS_PORT:-443}:${EPSILON_HTTPS_PORT:-443}"
    environment:
      - NODE_ENV=production
      - EPSILON_DATA=/app/data
      # Le conteneur expose 3000 → l'app doit écouter sur 3000 (défaut: 80).
      - HTTP_PORT=3000
      # Port d'écoute HTTPS DANS le conteneur (doit = le port publié ci-dessus).
      # HTTPS reste désactivé tant qu'il n'est pas activé dans l'admin (Réseau).
      # Une fois activé + un certificat généré + redémarrage, le port 3000 (HTTP)
      # redirige automatiquement vers ce port HTTPS.
      - HTTPS_PORT=${EPSILON_HTTPS_PORT:-443}
      # Accès Docker via le proxy filtré (jamais le socket brut).
      - DOCKER_HOST=tcp://docker-proxy:2375
      # Les choix d'adapters viennent du profile.yaml (écrit par le wizard de setup).
      # .env = secrets uniquement. Pour une base externe (Atlas...), définir DB_URI
      # ici => pas de provisioning Docker (BYO database).
      # Lecture du registre de modules privé (EPSILON-modules) pour les mises à
      # jour de modules (epsilon-admin-modules). Réutilise GH_TOKEN — qui doit
      # donc avoir packages:read (pull image) + Contents:read sur EPSILON-modules.
      # GH_TOKEN sert aussi au pull de l'image privée lors de la MàJ core in-app
      # (core.admin.applyUpdate → self-update via docker-proxy, packages:read).
      - GH_TOKEN=${GH_TOKEN}
      # Agent hôte : image du conteneur frère lancé en --network host pour observer
      # les VRAIES interfaces de la machine. En conteneur bridge, EPSILON ne voit que
      # sa propre interface (172.18.0.x) — aucune variable d'environnement ne peut y
      # suppléer, un namespace réseau ne se passe pas en paramètre.
      # ⚠️ Doit valoir EXACTEMENT le même tag que `image:` ci-dessus. Le core refuse
      # de deviner ce tag : un agent d'une autre version que le core serait pire que
      # pas d'agent du tout. Non définie => pas d'agent, et l'écran affiche « inconnu ».
      - EPSILON_HOST_AGENT_IMAGE=ghcr.io/ioup3409/epsilon:${EPSILON_VERSION:-latest}
      # Port réellement PUBLIÉ sur la machine — celui de la ligne `ports:` ci-dessus, pas celui
      # sur lequel le conteneur écoute. Les deux sont identiques par défaut (3000:3000), ce qui
      # rend l'écart invisible… jusqu'à ce qu'un utilisateur change EPSILON_PORT.
      # Sert de cible aux redirections de port UPnP : la box redirige vers <IP machine>:<ce port>.
      # ⚠️ Le core REFUSE de le deviner — sans cette variable, il n'ouvre aucune redirection et le
      # dit. Un port ouvert vers Internet qui pointe à côté est pire que pas de port du tout.
      - EPSILON_PUBLISHED_PORT=${EPSILON_PORT:-3000}
    volumes:
      - epsilon-backend:/app/data/backend
      - epsilon-frontend:/app/data/frontend
      # Socket unix de l'agent hôte. 🔴 C'est un SOCKET, jamais un port TCP : l'agent
      # tourne en --network host, où tout port ouvert serait publié sur le LAN. Ce
      # volume ne contient que le socket — jamais de données, jamais de secret.
      - epsilon-host-sock:/run/epsilon-host
      # Sources frontend des modules boot : volume → persistent à travers les mises
      # à jour d'image (le core update ne les écrase pas). SystemBootstrapper les
      # peuple + régénère _embedded.js au runtime.
      - epsilon-frontend-modules:/app/frontend/src/modules
    depends_on:
      - docker-proxy
    restart: unless-stopped
    networks:
      - epsilon-net

  # ── Socket-proxy ──────────────────────────────────────────────────────────
  # Expose l'API Docker en TCP, mais filtrée : seules les sections nécessaires
  # au provisioning de services sont autorisées. Tout le reste (AUTH, EXEC,
  # SECRETS, SWARM, CONFIGS...) reste bloqué. EPSILON ne voit jamais le socket brut.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1   # create / inspect / start / stop / rm des conteneurs
      - IMAGES=1       # pull des images de service (mongo, redis...)
      - NETWORKS=1     # inspect / create du réseau epsilon-net
      - VOLUMES=1      # volumes nommés persistants des services
      - POST=1         # autorise les opérations d'écriture (create/start/rm)
      - INFO=1         # /info ping du client docker
      # Mise à jour core in-app (core.admin.applyUpdate) : le conteneur one-shot
      # epsilon-updater doit stop/rename/create/start le conteneur epsilon.
      # tecnativa gate start/stop/restart séparément de POST :
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1   # couvre restart/kill (rollback du self-update)
      # Tout le reste reste à 0 (défaut) : AUTH, EXEC, SECRETS, SWARM, CONFIGS,
      # SERVICES, TASKS, NODES, PLUGINS, BUILD, COMMIT, SYSTEM...
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - epsilon-net

  # Note : plus de Watchtower. La mise à jour du core est in-app —
  # core.admin.applyUpdate pull la nouvelle image via docker-proxy puis lance un
  # conteneur one-shot « epsilon-updater » (depuis la NOUVELLE image, script
  # backend/scripts/self-update.js) qui recrée le conteneur epsilon avec sa
  # config clonée, avec rollback si le nouveau conteneur ne répond pas.

volumes:
  epsilon-backend:
  epsilon-frontend:
  epsilon-frontend-modules:
  # Partagé entre EPSILON et le conteneur epsilon-host-agent : le socket unix du
  # canal d'observation de l'hôte, et rien d'autre.
  #
  # 🔴 `name` figé, pour la MÊME raison que le réseau ci-dessous : sans lui, Compose préfixe
  # (<projet>_epsilon-host-sock, soit epsilon_epsilon-host-sock depuis /opt/epsilon) alors que
  # l'agent est lancé HORS compose par DockerManager, qui monte le nom littéral. EPSILON lirait
  # un volume et l'agent écrirait son socket dans un autre — symptôme : « agent injoignable »,
  # canal parfaitement fonctionnel.
  epsilon-host-sock:
    name: epsilon-host-sock
  # Note : les volumes des services provisionnés (epsilon-mongo-data...) sont
  # créés dynamiquement par DockerManager, hors de ce fichier — c'est voulu :
  # `docker compose down` ne doit pas effacer les données applicatives.

networks:
  # name figé : sans ça Compose préfixe (<projet>_epsilon-net) et les conteneurs
  # frères lancés par DockerManager (--network epsilon-net) ne rejoindraient pas
  # le même réseau qu'EPSILON.
  epsilon-net:
    name: epsilon-net
